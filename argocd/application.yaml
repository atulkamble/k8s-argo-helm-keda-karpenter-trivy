apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp
  namespace: argocd
spec:
  project: default
  source:
    # Change this URL if you fork the repository.
    repoURL: https://github.com/atulkamble/k8s-argo-helm-keda-karpenter-trivy.git
    targetRevision: main
    path: helm/webapp
    helm:
      releaseName: webapp
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
