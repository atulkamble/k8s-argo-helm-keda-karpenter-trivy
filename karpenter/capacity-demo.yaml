# Independent workload so Argo CD and KEDA do not undo this scaling demo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-demo
  namespace: default
spec:
  replicas: 0
  selector:
    matchLabels:
      app: capacity-demo
  template:
    metadata:
      labels:
        app: capacity-demo
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        karpenter.sh/nodepool: demo
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "1"
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 128Mi
