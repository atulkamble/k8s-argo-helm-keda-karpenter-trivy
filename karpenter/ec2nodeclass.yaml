# Requires an installed Karpenter v1 controller and completed AWS/IAM setup.
# Replace both placeholders with values from your cluster before applying.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: demo
spec:
  role: REPLACE_WITH_KARPENTER_NODE_ROLE
  amiSelectorTerms:
    # Demo convenience; select a tested AL2023 AMI version in production.
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: REPLACE_WITH_CLUSTER_NAME
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: REPLACE_WITH_CLUSTER_NAME
  tags:
    demo: k8s-tools
